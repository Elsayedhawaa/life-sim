<html lang="en">
<head>

<title>Lifeline – Phase 6 Expansion</title>

<style>
  :root{--bg:#0b0b12;--card:#14141f;--line:#25253a;--text:#e8e8f2;--muted:#8a8aa3;
        --violet:#8b5cf6;--cyan:#22d3ee;--rose:#fb7185;--mint:#34d399;--amber:#fbbf24}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:0 16px 16px}
  #app{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .mono{font-family:'JetBrains Mono',monospace;font-weight:500}
  .muted{color:var(--muted)} h3{font-size:1rem;margin-bottom:6px}
  p{line-height:1.5}

  /* Sticky header & navigation */
  #head{position:sticky;top:0;z-index:10;background:var(--bg);padding-top:16px;display:flex;flex-direction:column;gap:8px}
  .prof{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
  .who{display:flex;align-items:center;gap:10px}
  .avatar{font-size:2.3rem;line-height:1;filter:drop-shadow(0 4px 8px rgba(139,92,246,.45))}
  .age{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;line-height:.9;color:var(--violet)}
  .age small{font-size:.9rem;color:var(--muted);margin-left:4px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
  .stat-top{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:3px}
  .stat-top b{color:var(--text)}
  .bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
  .fill{height:100%;border-radius:3px;transition:width .4s}
  .wealth{display:flex;justify-content:space-between;margin-top:10px;font-size:.85rem;color:var(--muted)}
  .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .tab{flex:0 0 auto;padding:9px 14px;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:10px;font:500 .85rem 'DM Sans';cursor:pointer}
  .tab.on{color:var(--text);border-color:var(--violet)}
  .tab:disabled{opacity:.4;cursor:not-allowed}

  /* Buttons & Layout */
  .btn{display:block;width:100%;text-align:left;margin-top:8px;padding:12px 14px;background:transparent;color:var(--text);font:inherit;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:border-color .15s,background .15s}
  .btn:hover:not(:disabled),.btn:focus-visible{border-color:var(--violet);background:#1a1a2b;outline:none}
  .btn.sel{border-color:var(--violet);background:#1a1a2b}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn small{display:block;color:var(--muted);margin-top:2px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.9rem}
  .row:last-child{border:0}
  #age-wrap{position:sticky;bottom:12px;z-index:10}
  #age-btn{width:100%;padding:16px;border:0;border-radius:12px;cursor:pointer;background:var(--violet);color:#fff;font:700 1rem 'DM Sans'}
  #age-btn:hover:not(:disabled){filter:brightness(1.12)} #age-btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
  #hint{font-size:.8rem;color:var(--amber);text-align:center;min-height:1.2em;margin-bottom:4px}
  #log{max-height:220px;overflow-y:auto;font-size:.88rem}
  .log-row{padding:6px 0;border-bottom:1px solid var(--line);color:var(--muted)}
  .log-row b{color:var(--cyan);margin-right:8px;font-family:'JetBrains Mono',monospace;font-weight:500}
  .overlay{text-align:center;padding:28px 16px;margin-top:16px}
  .overlay h1{font-family:'Bebas Neue',sans-serif;font-size:3rem;font-weight:400;color:var(--violet)}
  .overlay p{color:var(--muted);margin:8px 0 16px}
  .overlay input{width:100%;padding:12px;margin-bottom:12px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;font:inherit;text-align:center}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .acts .btn{margin:0;padding:9px 10px;font-size:.85rem;text-align:center}
  .menu-btn{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:4px 12px;font:500 .8rem 'DM Sans';cursor:pointer}
  .hidden{display:none!important}
  .picker{display:flex;justify-content:center;gap:8px;margin-bottom:10px}
  .chip{font-size:1.7rem;padding:6px 12px;background:transparent;border:1px solid var(--line);border-radius:10px;cursor:pointer}
  .chip.sel{border-color:var(--violet);background:#1a1a2b}
  .bigav{font-size:4rem;line-height:1.1;margin:4px 0 10px;filter:drop-shadow(0 6px 14px rgba(139,92,246,.55))}
  .famrow{display:flex;gap:14px;flex-wrap:wrap}
  .famrow div{text-align:center;font-size:.7rem;color:var(--muted)}
  .famrow span{display:block;font-size:2rem;line-height:1.1}
  .sub-tabs{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto}
  .sub-tab{padding:6px 10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;font-size:.75rem;color:var(--muted);cursor:pointer}
  .sub-tab.on{border-color:var(--cyan);color:var(--text)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div id="app">
  <!-- START SCREEN -->
  <section id="start" class="card overlay">
    <h1>Lifeline</h1>
    <p>You are six years old. Every choice shapes the story ahead.</p>
    <div class="bigav" id="av-big"></div>
    <div class="picker" id="av-g"></div>
    <div class="picker" id="av-t"></div>
    <input id="name-input" placeholder="Your name" maxlength="20" autocomplete="off">
    <button class="btn" id="start-btn" style="text-align:center" onclick="startGame()">Begin life</button>
    <button class="btn hidden" id="cont-btn" style="text-align:center" onclick="loadGame()">Continue saved life</button>
  </section>

  <!-- GAME SCREEN -->
  <div id="game" class="hidden" style="display:flex;flex-direction:column;gap:12px">
    <header id="head">
      <section class="card" id="top"></section>
      <nav class="tabs" id="tabs"></nav>
    </header>
    <main id="view" style="display:flex;flex-direction:column;gap:12px"></main>
    <div id="age-wrap"><div id="hint"></div><button id="age-btn" onclick="ageUp()">Age up</button></div>
  </div>

  <!-- GAME OVER -->
  <section id="gameover" class="card overlay hidden">
    <h1>You passed away</h1><p id="summary"></p>
    <button class="btn" style="text-align:center" onclick="location.reload()">Live another life</button>
  </section>
</div>

const $ = id => document.getElementById(id);
const clamp = n => Math.max(0, Math.min(100, Math.round(n)));
const money = n => (n<0?'-$':'$') + Math.abs(Math.round(n)).toLocaleString();
const hint = t => { $('hint').textContent = t||''; };
function log(t){ S.logRows.unshift({age:S.age, t}); }

function fx(o){
  for (const k of ['health','happiness','smarts','social']) if (o[k]) S[k] = clamp(S[k]+o[k]);
  if (o.wealth) S.wealth += o.wealth;
  if (S.age<18) S.wealth = Math.max(0,S.wealth);
}
const bar = (l,v,c) => `<div><div class="stat-top"><span>${l}</span><b class="mono">${v}%</b></div><div class="bar"><div class="fill" style="width:${v}%;background:${c}"></div></div></div>`;
function go(t){ activeTab=t; render(); }
const evText = e => typeof e.text==='function' ? e.text() : e.text;
const costOf = c => typeof c.cost==='function' ? c.cost() : (c.cost||0);

const partner = () => S.family.find(m => (m.role==='Partner'||m.role==='Spouse') && m.alive);
const kids = () => S.family.filter(m => m.role==='Child');
const parents = () => S.family.filter(m => (m.role==='Mother'||m.role==='Father') && m.alive);
const bestBond = () => Math.max(0, ...parents().map(m=>m.bond));
const bankDebt = () => S.loans.reduce((a,l)=>a+l.bal,0) + S.shopLoans.reduce((a,l)=>a+l.bal,0);

function propertyValueTotal(){
  let tot = 0;
  S.ownedHomes.forEach(h => tot += (h.value - h.balance));
  return tot;
}
const netWorth = () => S.wealth + propertyValueTotal() + S.nest - S.loan - bankDebt();
const studying = () => S.age<18 || !!S.uni;
const myFace = () => face(S.av.g, S.av.t, S.age);
const memFace = m => face(m.g, m.t, m.age);

function schoolBlock(k){
  const s=SCHOOLS[k]; if (S.age>=18) return '';
  if (S.famWealth<s.need) return `Your family cannot afford this (needs ${FAMILY[s.need]} family).`;
  if (bestBond()<s.approve) return 'Your parents do not approve yet.';
  return '';
}

function tuitionFor(u){ return Math.round(UNIS[u.type].tuition*(u.scholar?.5:1)); }
function fundUni(u){
  const t=tuitionFor(u);
  if (u.pay==='parents' && parents().length && bestBond()>=20) return {help:t,cash:0,loan:0};
  if (u.pay==='loan') return {help:0,cash:0,loan:t};
  const cash=Math.min(t,Math.max(0,S.wealth));
  return {help:0,cash,loan:t-cash};
}

function parentsAgree(type){
  if (!parents().length) return false;
  const base=[[.5,0],[.85,.45],[.95,.8]][S.famWealth][type==='private'?1:0];
  return Math.random() < base*(.5+bestBond()/200);
}

function uniYear(notes,bill){
  const u=S.uni, un=UNIS[u.type], ef=EFFORT[S.effort], mj=MAJORS[u.major];
  if (u.pay==='parents' && !(parents().length && bestBond()>=20)){ u.pay='self'; log('Your parents can no longer pay tuition.'); }
  const f=fundUni(u), t=tuitionFor(u);
  fx({smarts:Math.round(ef.smarts>0?ef.smarts*un.mult:ef.smarts), happiness:ef.happiness, social:ef.social});
  if (f.cash) bill.tuition=f.cash;
  S.loan+=f.loan; u.year++;
  notes.push(`uni year ${u.year}/${mj.years}, tuition ${money(t)}`);
  if (u.year>=mj.years){ S.degree=u.major; S.uni=null; fx({happiness:8,social:3}); log(`Graduated with a degree in ${mj.name}!`); }
}

function incomeTax(taxable){
  let tax=0, prev=0;
  for (const [cap,rate] of BRACKETS){
    if (taxable>prev) tax += (Math.min(taxable,cap)-prev)*rate;
    prev=cap; if (taxable<=cap) break;
  }
  return Math.round(tax);
}
const incomeBasis = () => S.job ? S.job.salary : (S.retired ? S.pension : S.income);
const creditLimit = () => Math.max(0, Math.round(incomeBasis()*3 + propertyValueTotal()*.5 - S.loan - bankDebt()));

function retireNow(forced){
  const base = S.job ? S.job.salary : S.lastSalary;
  S.pension = Math.max(6000, Math.round(base*.4));
  S.retired = true; S.job = null; S.part = null;
  log(`${forced?'Forced mandatory retirement':'Retired'}. Pension: ${money(S.pension)}/yr.`);
}

function migrate(o){
  const base={
    famWealth:1,uni:null,degree:null,loan:0,part:null,housing:'parents',ownedHomes:[],
    family:[],evId:null,logRows:[],dead:false,social:50,av:{g:'n',t:0},payPref:'self',
    askedAge:-1,loans:[],food:'mid',transport:'bus',insured:false,contrib:0,nest:0,
    retired:false,pension:0,lastSalary:0,bill:{},inventory:[],shopLoans:[],schedule:'norm'
  };
  for (const k in base) if (!(k in o)) o[k]=base[k];
  if (o.school==='public'||o.school==='home') o.school='national';
  if (o.uni && !o.uni.pay) o.uni.pay='self';
  o.family.forEach(m=>{ if(!m.g) m.g = m.role==='Mother'?'f':m.role==='Father'?'m':'n'; if(m.t==null) m.t=o.av.t; });
  return o;
}

function addMember(role, age, bond){
  const g = role==='Mother'?'f':role==='Father'?'m':pick(['f','m']);
  const t = role==='Partner' ? rnd(3) : (S.av?S.av.t:0);
  const m = {id:'m'+Math.random().toString(36).slice(2,8), name:pick(NAMES), role, age, bond:clamp(bond), g, t, alive:true, done:false};
  S.family.push(m); return m;
}

function familyYear(){
  S.family.forEach(m => {
    if (!m.alive) return;
    m.age++; m.done=false; m.bond=clamp(m.bond-2);
    if (m.age>=75 && Math.random()<(m.age-74)*.04){ m.alive=false; fx({happiness:-10}); log(`${m.name} (${m.role.toLowerCase()}) passed away at ${m.age}.`); }
  });
  if (S.age>=18 && S.housing==='parents' && !parents().length){ S.housing=null; log('Your family home is no longer available.'); }
  return kids().filter(k=>k.alive && k.age<18).length*CHILD_COST;
}

/* Save / Restore */
let menuOpen=false, menuMsg='', resetArmed=false, newArmed=false;
function save(){
  if (!S || S.dead) return false;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({S, activeTab})); return true; } catch(e){ return false; }
}
function loadGame(){
  let d=null;
  try { d=JSON.parse(localStorage.getItem(SAVE_KEY)); } catch(e){}
  if (!d || !d.S || d.S.dead){ menuMsg='No saved game found.'; if (S) render(); return; }
  S = migrate(d.S); activeTab = d.activeTab || 'life'; menuOpen=false; hint();
  if (S.pending && S.evId) S.ev = EVENTS.find(e=>e.id===S.evId) || null;
  if (S.pending && !S.ev) S.pending=false;
  $('start').classList.add('hidden'); $('gameover').classList.add('hidden');$('game').classList.remove('hidden');
  menuMsg='Game loaded.'; render();
}
function manualSave(){ menuMsg = save() ? 'Game saved.' : 'Could not save.'; render(); }

/* Restart Life Function */
function restartLifeAtSix(){
  if (!confirm('Are you sure you want to restart life at Age 6? Current progress will be lost.')) return;
  const name = S.name, g = S.av.g, t = S.av.t;
  newGame(name, g, t);
  activeTab = 'life'; menuOpen = false;
  save();
  $('start').classList.add('hidden'); $('gameover').classList.add('hidden');$('game').classList.remove('hidden');
  log('Life restarted at Age 6.');
  render();
}

function resetGame(){
  if (!resetArmed){ resetArmed=true; menuMsg='Tap Reset game again to delete save.'; render(); return; }
  try { localStorage.removeItem(SAVE_KEY); } catch(e){}
  S = null; location.reload();
}
function toggleMenu(){ menuOpen=!menuOpen; menuMsg=''; resetArmed=false; render(); }

const menuCard = () => `<section class="card"><h3>Menu</h3><p class="muted">${menuMsg||'Your game saves automatically after every change.'}</p>
  <div class="acts">
    <button class="btn" onclick="manualSave()">Save game</button>
    <button class="btn" onclick="loadGame()">Load game</button>
    <button class="btn" onclick="restartLifeAtSix()">Restart at Age 6</button>
    <button class="btn" onclick="resetGame()">${resetArmed?'Confirm Delete':'Reset Game'}</button>
    <button class="btn" onclick="toggleMenu()">Close</button>
  </div></section>`;

    <div class="stats">${bar('Health',S.health,'var(--rose)')}${bar('Happiness',S.happiness,'var(--amber)')}${bar('Smarts',S.smarts,'var(--cyan)')}${bar('Social',S.social,'var(--violet)')}</div>
    <div class="wealth"><span>Wealth</span><b class="mono" style="color:${S.wealth<0?'var(--rose)':'var(--mint)'}">${money(S.wealth)}</b></div>`;
  
  const tabs = [
    ['life','Life',true,''],
    ['school','Education',true,''],
    ['part','Part-time',S.age>=14&&studying(),'Students age 14+'],
    ['career','Career',S.age>=18,'Unlocks at 18'],
    ['family','Relationships',true,''],
    ['assets','Real Estate',true,''],
    ['shop','Shopping',S.age>=12,'Unlocks at 12'],
    ['money','Money',S.age>=18,'Unlocks at 18'],
    ['bank','Bank',S.age>=18,'Unlocks at 18'],
    ['act','Activities',true,'']
  ];
  const cur = tabs.find(t=>t[0]===activeTab); if (!cur || !cur[2]) activeTab='life';
  $('tabs').innerHTML = tabs.map(([id,l,ok,why]) => `<button class="tab ${activeTab===id?'on':''}" ${ok?'':`disabled title="${why}"`} onclick="go('${id}')">${l}</button>`).join('');
  
  $('age-btn').disabled = S.pending;
  $('view').innerHTML = (menuOpen?menuCard():'') + ({
    life:viewLife, school:viewSchool, part:viewPart, career:viewCareer, family:viewFamily,
    assets:viewAssets, shop:viewShop, money:viewMoney, bank:viewBank, act:viewActivities
  })[activeTab]();
  save();
}

function viewLife(){
  const e = S.ev;
  const household = `<section class="card"><div class="famrow"><div><span>${myFace()}</span>You</div>${S.family.filter(m=>m.alive).map(m=>`<div><span>${memFace(m)}</span>${m.name}</div>`).join('')}</div></section>`;
  const eventCard = e
    ? `<section class="card"><h3>${e.title}</h3><p class="muted">${evText(e)}</p>${(e.choices||[]).map((c,i)=>{ const no=costOf(c)>S.wealth; return `<button class="btn" ${no?'disabled':''} onclick="choose(${i})">${c.label}${no?'<small>Not enough cash</small>':''}</button>`; }).join('')}</section>`
    : `<section class="card"><h3>Your story</h3><p class="muted">Press Age up to continue.</p></section>`;
  return household + eventCard + `<section class="card"><h3>Life log</h3><div id="log">${S.logRows.map(r=>`<div class="log-row"><b>Age ${r.age}</b>${r.t}</div>`).join('')}</div></section>`;

function viewSchool(){
  const efforts = Object.entries(EFFORT).map(([k,e]) => `<button class="btn ${S.effort===k?'sel':''}" onclick="pickEffort('${k}')">${e.label}</button>`).join('');
  const effortCard = `<section class="card"><h3>Effort this year</h3><p class="muted">Applied when you age up.${S.age<18?' Years skipped: '+S.skips+'.':''}</p>${efforts}</section>`;
  if (S.age<18){
    const schools = Object.entries(SCHOOLS).map(([k,s]) => { const why=schoolBlock(k);
      return `<button class="btn ${S.school===k?'sel':''}" ${why?'disabled':''} onclick="pickSchool('${k}')">${s.name} · ${s.cost?money(s.cost)+'/yr, paid by parents':'Free'}<small>${why||s.desc}</small></button>`; }).join('');
    return `<section class="card"><h3>School</h3><p class="muted">Family status: <b>${FAMILY[S.famWealth]}</b>.</p>${schools}</section>` + effortCard;
  }
  if (S.uni){
    const u=S.uni, un=UNIS[u.type], mj=MAJORS[u.major];
    return `<section class="card"><h3>${mj.name} · ${un.name}</h3><p class="muted">Year ${u.year} of ${mj.years}. Tuition ${money(tuitionFor(u))}/yr. Student loan: ${money(S.loan)}.</p><button class="btn" onclick="dropOut()">Drop out</button></section>` + effortCard;
  }
  if (S.degree) return `<section class="card"><h3>Graduate</h3><p class="muted">Degree: <b>${MAJORS[S.degree].name}</b>. Higher career levels unlocked!</p></section>`;
  if (!S.diploma) return `<section class="card"><h3>No diploma</h3><p class="muted">You left school without a diploma.</p></section>`;
  const payBtns = Object.entries(PAYERS).map(([k,p]) => `<button class="btn ${S.payPref===k?'sel':''}" onclick="setPay('${k}')">${p.label}<small>${p.desc}</small></button>`).join('');
  const majors = Object.entries(MAJORS).map(([k,m]) => `<div style="margin-top:12px"><b>${m.name}</b> <span class="muted">· ${m.years} yrs · Req Smarts ${m.min}%</span>
    <div class="acts" style="margin-top:6px"><button class="btn" onclick="enrollUni('national','${k}')">National · ${money(UNIS.national.tuition)}/yr</button><button class="btn" onclick="enrollUni('private','${k}')">Private · ${money(UNIS.private.tuition)}/yr</button></div></div>`).join('');
  return `<section class="card"><h3>Who pays tuition?</h3>${payBtns}</section><section class="card"><h3>University</h3>${majors}</section>`;
}

function viewPart(){
  const cur=S.part;
  const list = PART_JOBS.map(p => { const why=(S.age<p.minAge?`From age ${p.minAge}. `:'')+(S.smarts<p.smarts?`Needs ${p.smarts}% Smarts.`:'');
    return `<button class="btn ${cur&&cur.id===p.id?'sel':''}" ${why?'disabled':''} onclick="takePart('${p.id}')">${p.title} · ${money(p.pay)}/yr<small>${why||'Stress '+p.stress+'/yr.'}</small></button>`; }).join('');
  return `<section class="card"><h3>Part-time work</h3><p class="muted">${cur?`Working as a ${cur.title.toLowerCase()}.`:'Side job for students.'}</p>${list}${cur?'<button class="btn" onclick="quitJob()">Quit job</button>':''}</section>`;
}

/* CAREER TAB: Multi-Tiered Ranks, Work Schedules, Overtime */
function viewCareer(){
  const b=S.bill||{}, net = S.income - S.expenses;
  const fin = `<section class="card"><h3>Finances (last year)</h3>
    <div class="row"><span>Gross income</span><b class="mono" style="color:var(--mint)">${money(S.income)}</b></div>
    <div class="row"><span>Net change</span><b class="mono">${money(net)}</b></div>
    <div class="row"><span>Net worth</span><b class="mono">${money(netWorth())}</b></div></section>`;
    
  if (S.retired) return fin + `<section class="card"><h3>Retired</h3><p class="muted">Pension ${money(S.pension)}/yr.</p></section>`;
  
  if (S.job){
    const j = S.job;
    const schedText = S.schedule==='over' ? 'Long Hours (50 hrs/wk, +Perf, +Stress)' : S.schedule==='crunch' ? 'Crunch Mode (60 hrs/wk, ++Perf, ++Stress)' : 'Standard (40 hrs/wk)';
    return fin + `<section class="card">
      <h3>${j.title}</h3>
      <p class="muted">Track: ${TRACKS[j.trackId].name} (Level ${j.level+1}/5)</p>
      <p class="muted">Salary ${money(j.salary)}/yr · Tenure: ${j.years} year(s)</p>
      <div style="margin:10px 0">${bar('Performance',j.perf,'var(--cyan)')}</div>
      
      <p class="muted" style="margin-top:8px;font-size:.85rem">Work Schedule: <b>${schedText}</b></p>
      <div class="acts" style="margin-top:6px">
        <button class="btn ${S.schedule==='norm'?'sel':''}" onclick="setSchedule('norm')">40 hrs/wk</button>
        <button class="btn ${S.schedule==='over'?'sel':''}" onclick="setSchedule('over')">50 hrs/wk</button>
        <button class="btn ${S.schedule==='crunch'?'sel':''}" onclick="setSchedule('crunch')">60 hrs/wk</button>
      </div>

      <button class="btn" ${S.worked?'disabled':''} onclick="workHarder()">Work Overtime / Harder<small>Boost performance once this year.</small></button>
      <button class="btn" ${S.promoTried?'disabled':''} onclick="askPromotion()">Request Rank Promotion<small>Advance to the next career level if qualified.</small></button>
      <button class="btn" onclick="quitJob()">Resign / Quit</button>
    </section>`;
  }

  // Job Market
  let html = fin + `<section class="card"><h3>Career Market Tracks</h3><p class="muted">${S.uni?'Finish university to unlock full-time careers.':'Apply for entry level or degree positions:'}</p>`;
  
  Object.entries(TRACKS).forEach(([trackId, track]) => {
    const entryJob = track.levels[0];
    const canDegree = !track.degree || S.degree === track.degree;
    const blockWhy = (S.uni?'Finish university first. ':'') + (!canDegree ? `Requires ${MAJORS[track.degree].name} degree. ` : '') + (S.smarts < entryJob.reqSmarts ? `Requires ${entryJob.reqSmarts}% Smarts.` : '');
    
    html += `<div style="margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:8px">
      <b>${track.name}</b><br>
      <span class="muted" style="font-size:.85rem">Level 1: ${entryJob.title} (${money(entryJob.salary)}/yr)</span>
      <button class="btn" ${blockWhy||S.uni?'disabled':''} onclick="applyTrack('${trackId}')">${blockWhy ? blockWhy : 'Apply for Entry Position'}</button>
    </div>`;
  });
  
  html += `</section>`;
  return html;
}

/* REAL ESTATE TAB: Ownership, Renting, Renovating, Living */

  let html = `<section class="card"><h3>Real Estate Portfolio</h3><p class="muted">Total Equity: <b>${money(propertyValueTotal())}</b></p></section>`;

  // Owned Properties
  if (S.ownedHomes.length > 0){
    html += `<section class="card"><h3>Your Owned Properties</h3>`;
    S.ownedHomes.forEach((h, idx) => {
      const isLive = S.housing === h.id;
      const isRent = h.status === 'rent';
      html += `<div style="margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:8px">
        <b>${h.name}</b> (${h.cond}% condition)<br>
        <span class="muted" style="font-size:.85rem">Market Value: ${money(h.value)} | Mortgage Left: ${money(h.balance)}</span><br>

        <div class="acts" style="margin-top:8px">
          ${!isLive ? `<button class="btn" onclick="setLiveProperty(${idx})">Move In</button>` : ''}
          ${!isRent && !isLive ? `<button class="btn" onclick="setRentProperty(${idx})">Rent Out</button>` : ''}
          <button class="btn" ${S.wealth < 3000 ? 'disabled':''} onclick="renovateProperty(${idx})">Renovate ($3,000)</button>
          <button class="btn" onclick="sellOwnedProperty(${idx})">Sell Property</button>
        </div>
      </div>`;
    });
    html += `</section>`;
  }

  // Primary Residence Setup
  const stayFamily = `<button class="btn ${S.housing==='parents'?'sel':''}" onclick="stayHome()">Stay with parents<small>${S.famWealth>=1?'Free':'$1,500/yr contribution'}</small></button>`;
  
  // Rentals Catalog
  const rents = HOUSING_CATALOG.filter(h=>h.kind==='rent').map(h => 
    `<button class="btn ${S.housing===h.id?'sel':''}" onclick="rentHome('${h.id}')">${h.name} · ${money(h.cost)}/yr<small>${h.desc}</small></button>`
  ).join('');

  // Purchase Market Catalog
  const buys = HOUSING_CATALOG.filter(h=>h.kind==='buy').map(h => {
    const down = h.price * 0.20;
    return `<div style="margin-top:10px">
      <b>${h.name}</b> · ${money(h.price)}
      <p class="muted" style="font-size:.85rem">${h.desc} | Rental Income potential: ${money(h.rentInc)}/yr</p>
      <div class="acts" style="margin-top:6px">
        <button class="btn" ${S.wealth<h.price?'disabled':''} onclick="buyProperty('${h.id}', true)">Cash ${money(h.price)}</button>
        <button class="btn" ${S.wealth<down?'disabled':''} onclick="buyProperty('${h.id}', false)">Down ${money(down)}</button>
      </div>
    </div>`;
  }).join('');

  return html + `<section class="card"><h3>Living Options</h3>${stayFamily}</section>
    <section class="card"><h3>Rent an Apartment</h3>${rents}</section>
    <section class="card"><h3>Buy Real Estate</h3>${buys}</section>`;
}

  if (S.inventory.length > 0){
    invHtml = `<section class="card"><h3>Your Purchased Items</h3>` + S.inventory.map(i => 
      `<div class="row"><span>${i.model}</span><b class="mono">${i.life - i.age} yrs left</b></div>`
    ).join('') + `</section>`;
  }

  return `<section class="card"><h3>Shopping Mall & Stores</h3>${nav}</section>` +
    `<section class="card">${itemsHtml}</section>` + invHtml;
}

function viewMoney(){
  const sel=(cond)=>cond?'sel':'';
  const food = Object.entries(FOOD).map(([k,f])=>`<button class="btn ${sel(S.food===k)}" onclick="setFood('${k}')">${f.name} · ${money(f.cost)}/yr<small>${f.desc}</small></button>`).join('');
  const trans = Object.entries(TRANSPORT).map(([k,t])=>`<button class="btn ${sel(S.transport===k)}" onclick="setTransport('${k}')">${t.name} · ${money(t.cost)}/yr<small>${t.desc}</small></button>`).join('');
  const ins = `<button class="btn ${sel(S.insured)}" onclick="toggleInsurance()">Insurance: ${S.insured?'ON':'OFF'} · ${money(INSURANCE)}/yr</button>`;
  
  const b=S.bill||{}, rows=Object.entries(b).filter(([k,v])=>v>0).map(([k,v])=>`<div class="row"><span>${k}</span><b class="mono">${money(-v)}</b></div>`).join('');
  
  return `<section class="card"><h3>Financial Overview</h3>
    <div class="row"><span>Cash</span><b class="mono">${money(S.wealth)}</b></div>
    <div class="row"><span>Real Estate Equity</span><b class="mono">${money(propertyValueTotal())}</b></div>
    <div class="row"><span>Total Debts</span><b class="mono" style="color:var(--rose)">${money(-bankDebt())}</b></div>
    <div class="row"><span>Net Worth</span><b class="mono">${money(netWorth())}</b></div>
  </section>` +
  `<section class="card"><h3>Lifestyle & Spending</h3>${food}<h3 style="margin-top:10px">Transport</h3>${trans}<h3 style="margin-top:10px">Insurance</h3>${ins}</section>` +
  `<section class="card"><h3>Last Year Expense Breakdown</h3>${rows||'<p class="muted">No bills recorded yet.</p>'}</section>`;
}

function viewBank(){
  const lim=creditLimit();
  const offers=[2000,5000,10000,25000,50000].map(a=>{
    const r=a<=5000?.08:.10, pmt=Math.round(a*r/(1-Math.pow(1+r,-5)));
    return `<button class="btn" ${a>lim?'disabled':''} onclick="takeLoan(${a})">Borrow ${money(a)}<small>${Math.round(r*100)}% interest, ${money(pmt)}/yr for 5 yrs</small></button>`;
  }).join('');
  
  const bankLoansHtml = S.loans.map((l,i)=>`<div style="margin-top:10px"><b>Bank Loan</b> · Owed ${money(l.bal)}
    <button class="btn" ${S.wealth<l.bal?'disabled':''} onclick="payBank(${i},'all')">Pay off ${money(l.bal)}</button></div>`).join('');
    
  const shopLoansHtml = S.shopLoans.map((l,i)=>`<div style="margin-top:10px"><b>Installment: ${l.item}</b> · Owed ${money(l.bal)} (${money(l.pmt)}/yr)</div>`).join('');

  return `<section class="card"><h3>Bank Credit & Loans</h3><p class="muted">Credit Limit: <b>${money(lim)}</b></p>${offers}</section>
    <section class="card"><h3>Active Debt Contracts</h3>${bankLoansHtml||shopLoansHtml?bankLoansHtml+shopLoansHtml:'<p class="muted">No bank debt.</p>'}</section>`;
}

function viewActivities(){
  const list = ACTIVITIES.map((a,i) => `<button class="btn" ${S.actions<1||(S.age>=18&&a.cost>S.wealth)?'disabled':''} onclick="doActivity(${i})">${a.label}<small>${a.cost&&S.age>=18?money(a.cost):'Free'}</small></button>`).join('');
  return `<section class="card"><h3>Activities & Lifestyle</h3><p class="muted">Actions left: <b>${S.actions}</b></p>${list}</section>`;
}

/* =====================================================================
   4. USER ACTIONS & CAREER LOGIC
   ===================================================================== */
function pickSchool(k){ const why=schoolBlock(k); if (why) return hint(why); S.school=k; log(`Enrolled in ${SCHOOLS[k].name}.`); hint(); render(); }
function pickEffort(k){ S.effort=k; render(); }
function setPay(k){ S.payPref=k; hint(); render(); }

/* FIX: University enrollment no longer blocks you for negative cash if funding via parents or loan */
function enrollUni(type, major){
  const un=UNIS[type], mj=MAJORS[major];
  if (S.job) return hint('Quit job before enrolling.');
  if (S.smarts<mj.min+un.minOff) return hint(`Requires ${mj.min+un.minOff}% Smarts.`);
  
  const u={type, major, year:0, pay:S.payPref, scholar:false};
  if (u.pay==='parents'){
    if (S.askedAge===S.age) return hint('Already asked parents this year.');
    S.askedAge=S.age;
    if (!parentsAgree(type)){
      parents().forEach(m=>m.bond=clamp(m.bond-3));
      log(`Parents refused to pay for ${mj.name}.`); render();
      return hint('Parents refused.');
    }
  }

  const f = fundUni(u);
  if (S.loan + f.loan > LOAN_CAP) return hint('Student loan limit would be exceeded.');

  S.uni=u; log(`Enrolled in ${mj.name} at ${un.name}.`); hint(); render();
}

function dropOut(){ log('Dropped out of university.'); S.uni=null; render(); }
function takePart(id){ const p=PART_JOBS.find(x=>x.id===id); S.part={id:p.id,title:p.title,pay:p.pay,stress:p.stress}; log(`Started part-time job as ${p.title}.`); render(); }
function quitPart(){ log('Quit part-time job.'); S.part=null; render(); }

/* Career Logic */
function applyTrack(trackId){
  const track = TRACKS[trackId];
  const level0 = track.levels[0];
  S.job = {
    trackId: trackId,
    level: 0,
    title: level0.title,
    salary: level0.salary,
    perf: 50,
    years: 0
  };
  log(`Started new career track: ${track.name} as ${level0.title} (${money(level0.salary)}/yr)!`);
  render();
}

function setSchedule(sched){ S.schedule = sched; render(); }

function workHarder(){
  S.worked = true;
  S.job.perf = clamp(S.job.perf + 15);
  fx({health:-4, happiness:-4});
  log('Worked extra hard on your job projects.');
  render();
}

function askPromotion(){
  S.promoTried = true;
  const j = S.job;
  const track = TRACKS[j.trackId];
  if (j.level >= track.levels.length - 1){
    return hint('You have reached the highest executive rank in this career!');
  }
  const nextLevel = track.levels[j.level + 1];
  
  const successChance = (j.perf * 0.5 + S.smarts * 0.3 + Math.min(j.years, 5) * 4) / 100;
  if (Math.random() < successChance && S.smarts >= nextLevel.reqSmarts){
    j.level++;
    j.title = nextLevel.title;
    j.salary = nextLevel.salary;
    j.perf = 50;
    j.years = 0;
    fx({happiness:10});
    log(`PROMOTED! You are now a ${j.title} earning ${money(j.salary)}/yr!`);
  } else {
    j.perf = clamp(j.perf - 8);
    fx({happiness:-5});
    log('Your promotion request was denied by management.');
  }
  render();
}

function quitJob(){ log(`Quit job as ${S.job.title}.`); S.job=null; render(); }

/* Property Management Actions */
function stayHome(){ S.housing='parents'; log('Living with parents.'); render(); }
function rentHome(id){ S.housing=id; log('Rented an apartment.'); render(); }

function buyProperty(catId, isCash){
  const cat = HOUSING_CATALOG.find(c => c.id === catId);
  const cost = isCash ? cat.price : cat.price * 0.20;
  if (S.wealth < cost) return hint('Not enough cash.');
  
  S.wealth -= cost;
  const newHome = {
    id: 'h_' + Math.random().toString(36).slice(2,7),
    catId: catId,
    name: cat.name,
    value: cat.price,
    balance: isCash ? 0 : cat.price - cost,
    cond: 100,
    rentInc: cat.rentInc || 0,
    status: 'vacant'
  };
  S.ownedHomes.push(newHome);
  log(`Bought property: ${cat.name}!`);
  render();
}

function setLiveProperty(idx){
  S.ownedHomes.forEach(h => { if(h.status==='live') h.status='vacant'; });
  S.ownedHomes[idx].status = 'live';
  S.housing = S.ownedHomes[idx].id;
  log(`Moved into ${S.ownedHomes[idx].name}.`);
  render();
}

function setRentProperty(idx){
  S.ownedHomes[idx].status = 'rent';
  if (S.housing === S.ownedHomes[idx].id) S.housing = 'parents';
  log(`Rented out ${S.ownedHomes[idx].name} to tenants.`);
  render();
}

function renovateProperty(idx){
  if (S.wealth < 3000) return hint('Renovation costs $3,000.');
  S.wealth -= 3000;
  S.ownedHomes[idx].cond = clamp(S.ownedHomes[idx].cond + 25);
  S.ownedHomes[idx].value = Math.round(S.ownedHomes[idx].value * 1.08);
  log(`Renovated ${S.ownedHomes[idx].name}! Property value increased.`);
  render();
}

function sellOwnedProperty(idx){
  const h = S.ownedHomes[idx];
  const equity = h.value - h.balance;
  S.wealth += equity;
  if (S.housing === h.id) S.housing = 'parents';
  log(`Sold ${h.name} for ${money(equity)} net equity.`);
  S.ownedHomes.splice(idx, 1);
  render();
}

/* Shopping Actions */
function buyShopItem(itemId, method){
  const item = SHOP_ITEMS.find(i => i.id === itemId);
  if (method === 'cash'){
    if (S.wealth < item.cost) return hint('Not enough cash.');
    S.wealth -= item.cost;
    S.inventory.push({itemId: item.id, model: item.model, age:0, life: item.life, hap: item.hap, hp: item.hp, soc: item.soc});
    fx({happiness: item.hap * 2, social: item.soc * 2});
    log(`Purchased ${item.model} from ${item.store}!`);
  } else {
    const instPmt = Math.round((item.cost * 1.15) / 3);
    if (creditLimit() < instPmt) return hint('Bank declined installment credit.');
    S.shopLoans.push({item: item.model, bal: item.cost * 1.15, pmt: instPmt});
    S.inventory.push({itemId: item.id, model: item.model, age:0, life: item.life, hap: item.hap, hp: item.hp, soc: item.soc});
    log(`Financed ${item.model} on 3-year installment plan.`);
  }
  render();
}

function setFood(k){ S.food=k; render(); }
function setTransport(k){ S.transport=k; render(); }
function toggleInsurance(){ S.insured=!S.insured; render(); }

function takeLoan(a){
  if (a > creditLimit()) return hint('Credit limit exceeded.');
  const r = a<=5000?.08:.10, pmt = Math.round(a*r/(1-Math.pow(1+r,-5)));
  S.loans.push({amt:a, bal:a, rate:r, pmt:pmt});
  S.wealth += a;
  log(`Borrowed ${money(a)} from bank.`);
  render();
}

function payBank(i, type){
  const l = S.loans[i];
  if (S.wealth < l.bal) return hint('Not enough cash.');
  S.wealth -= l.bal;
  S.loans.splice(i, 1);
  log('Paid off bank loan completely!');
  render();
}

function famAct(id, type){
  const m = S.family.find(x=>x.id===id); m.done=true;
  if (type==='time'){ m.bond=clamp(m.bond+8); fx({happiness:2,social:2}); log(`Spent time with ${m.name}.`); }
  else if (type==='compliment'){ m.bond=clamp(m.bond+5); fx({social:1}); log(`Complimented ${m.name}.`); }
  else if (type==='argue'){ m.bond=clamp(m.bond-10); fx({happiness:3,social:-2}); log(`Argued with ${m.name}.`); }
  else if (Math.random()<m.bond/100*.9){ const amt=(S.age<18?50:300)+rnd(150); S.wealth+=amt; m.bond=clamp(m.bond-2); log(`${m.name} gave you ${money(amt)}.`); }
  else { m.bond=clamp(m.bond-4); log(`${m.name} declined request.`); }
  render();
}

function doActivity(i){
  const a=ACTIVITIES[i], cost = S.age>=18?a.cost:0;
  if (cost>S.wealth) return hint('Not enough cash.');
  S.actions--; S.wealth-=cost; fx(a.fx); log(a.msg); render();
}

function choose(i){
  const c = S.ev.choices[i];
  if (costOf(c)>S.wealth) return hint('Not enough cash.');
  const f = typeof c.fx==='function' ? c.fx() : c.fx;
  fx(f);
  const msg = f.msg || c.result;
  log(`${S.ev.title}: ${msg}`);
  S.ev = {title:S.ev.title, text:msg, choices:[]};
  S.pending = false; S.evId = null;
  checkDeath(); render();
}

/* =====================================================================
   5. YEARLY AGE UP TICK
   ===================================================================== */
function ageUp(){
  if (S.pending) return hint('Make your choice first.');
  if (S.age < 18 && !S.school){ go('school'); return hint('Pick school first.'); }
  if (S.age >= 18 && !S.housing){ go('assets'); return hint('Choose housing in Real Estate first.'); }
  hint();
  
  S.age++; S.actions=2; S.worked=false; S.promoTried=false; S.income=0; S.expenses=0;
  const notes = [], bill = {};
  const wasStudying = S.age<=18 || !!S.uni;

  if (S.age <= 18){
    const sc=SCHOOLS[S.school]||SCHOOLS.national, ef=EFFORT[S.effort];
    fx({smarts:Math.round(ef.smarts>0?ef.smarts*sc.mult:ef.smarts), happiness:ef.happiness, social:ef.social+sc.social});
    if (S.effort==='skip') S.skips++;
  }
  if (S.age===18){
    S.diploma = S.skips<5;
    log(S.diploma?'Graduated high school!':'Left school without diploma.');
  }

  if (S.uni) uniYear(notes, bill);

  if (S.part){
    if (!wasStudying){ S.part=null; }
    else { const st=S.part.stress+(S.effort==='hard'?2:0); S.income+=S.part.pay; fx({happiness:-st, health:-1}); }
  }

  // Job Progress & Salary
  if (S.job){
    const track = TRACKS[S.job.trackId];
    const lvlData = track.levels[S.job.level];
    
    // Work Schedule Stress/Bonus
    let extraPerf = 0, extraStress = 0;
    if (S.schedule === 'over'){ extraPerf = 8; extraStress = 4; }
    else if (S.schedule === 'crunch'){ extraPerf = 18; extraStress = 9; }
    
    S.job.perf = clamp(S.job.perf + extraPerf - 2);
    fx({happiness: -(lvlData.stress + extraStress), health: extraStress > 5 ? -2 : 0});
    
    S.income += S.job.salary;
    S.job.years++;
    
    if (S.job.perf < 10){
      log(`Fired from ${S.job.title} due to poor performance!`);
      S.lastSalary = S.job.salary;
      S.job = null;
    }
  }

  // Owned Real Estate Portfolio Tick
  S.ownedHomes.forEach(h => {
    h.cond = clamp(h.cond - 3);
    h.value = Math.round(h.value * 1.03); // 3% annual appreciation
    if (h.balance > 0){
      const pmt = Math.min(h.balance, Math.round(h.value * 0.04));
      h.balance -= pmt;
      bill['mortgage_' + h.id] = pmt;
    }
    if (h.status === 'rent'){
      const rentCollected = Math.round(h.rentInc * (h.cond / 100));
      S.income += rentCollected;
      notes.push(`Collected ${money(rentCollected)} rent`);
    }
  });

  // Inventory Lifetime & Stat Boosts
  S.inventory.forEach((inv, idx) => {
    inv.age++;
    fx({happiness: inv.hap, health: inv.hp, social: inv.soc});
  });
  S.inventory = S.inventory.filter(inv => inv.age < inv.life);

  // Shop Installments Payment
  S.shopLoans.forEach((l, idx) => {
    const pmt = Math.min(l.bal, l.pmt);
    l.bal -= pmt;
    bill['installment_' + idx] = pmt;
  });
  S.shopLoans = S.shopLoans.filter(l => l.bal > 0);

  // Living Costs
  if (S.age>=18){
    const withP = S.housing==='parents', fd=FOOD[S.food], tr=TRANSPORT[S.transport];
    bill.groceries = Math.round(fd.cost*(withP?.4:1));
    bill.phone = PHONE;
    bill.transport = tr.cost;
    if (S.insured) bill.insurance = INSURANCE;
    fx({health:fd.hp, happiness:fd.hap+tr.hap});

    bill.payrollTax = Math.round(S.income * PAYROLL);
    bill.incomeTax = incomeTax(Math.max(0, S.income));
    
    if (S.loan>0){
      S.loan = Math.round(S.loan * 1.05);
      const r = Math.min(S.loan, Math.round(S.income * .10));
      S.loan -= r;
      bill.studentLoan = r;
    }
  }

  bill.children = familyYear();
  S.expenses = Object.values(bill).reduce((a,b)=>a+b,0);
  S.bill = bill;
  S.wealth += S.income - S.expenses;
  
  if (S.age<18) S.wealth = Math.max(0, S.wealth);

  const pool = EVENTS.filter(e=>S.age>=e.min && S.age<=e.max && e.id!==S.lastEvent && (!e.ok || e.ok()));
  if (pool.length && Math.random()<.8){
    const e = pool[Math.floor(Math.random()*pool.length)];
    S.lastEvent=e.id; S.ev=e; S.evId=e.id; S.pending=true; activeTab='life';
  } else S.ev={title:'A quiet year',text:'Nothing major happened. Life went on.',choices:[]};

  checkDeath(); render();
}

function checkDeath(){
  if (S.health>0) return;
  S.dead=true; try { localStorage.removeItem(SAVE_KEY); } catch(e){}
  $('game').classList.add('hidden'); $('gameover').classList.remove('hidden');$('summary').textContent = `${S.name} lived to ${S.age}. Final net worth: ${money(netWorth())}. Smarts ${S.smarts}%, Happiness ${S.happiness}%, Social ${S.social}%.`;
}

/* Setup & Initialization */
let avG='n', avT=0;
function renderPick(){
  $('av-big').textContent = face(avG,avT,6);$('av-g').innerHTML = [['f','Girl'],['n','Neutral'],['m','Boy']].map(([g,l])=>`<button class="chip ${avG===g?'sel':''}" onclick="pickG('${g}')">${face(g,avT,20)}</button>`).join('');
  $('av-t').innerHTML = [0,1,2].map(t=>`<button class="chip ${avT===t?'sel':''}" onclick="pickT(${t})">🖐${TONES[t]}</button>`).join('');
}
function pickG(g){ avG=g; renderPick(); }
function pickT(t){ avT=t; renderPick(); }

function hasSave(){ let d=null; try { d=JSON.parse(localStorage.getItem(SAVE_KEY)); } catch(e){} return !!(d && d.S && !d.S.dead); }

function startGame(){
  if (hasSave() && !newArmed){ newArmed=true; $('start-btn').textContent='Tap again to replace saved life'; return; }
  newGame($('name-input').value.trim(), avG, avT);
  activeTab='life'; menuOpen=false; newArmed=false;
  $('start').classList.add('hidden');$('game').classList.remove('hidden');
  log('Life began at age 6.');
  S.ev={title:'Your story begins',text:`${S.name}, you are 6 years old and starting school. Open Education to choose your effort level.`,choices:[]};
  render();
}

function initStart(){
  let d=null; try { d=JSON.parse(localStorage.getItem(SAVE_KEY)); } catch(e){}
  const b=$('cont-btn');
  if (d && d.S && !d.S.dead){ b.textContent=`Continue saved life: ${d.S.name}, age ${d.S.age}`; b.classList.remove('hidden'); return true; }
  b.classList.add('hidden'); return false;
}

renderPick();
$('name-input').addEventListener('keydown', e => { if (e.key==='Enter') startGame(); });
window.addEventListener('beforeunload', () => save());
if (initStart()){
  try { loadGame(); }
  catch(err){ S=null; $('game').classList.add('hidden');$('start').classList.remove('hidden'); }
}
</script>
