<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lifeline – Phase 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* ---------- Design tokens ---------- */
  :root{--bg:#0b0b12;--card:#14141f;--line:#25253a;--text:#e8e8f2;--muted:#8a8aa3;
        --violet:#8b5cf6;--cyan:#22d3ee;--rose:#fb7185;--mint:#34d399;--amber:#fbbf24}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:0 16px 16px}
  #app{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .mono{font-family:'JetBrains Mono',monospace;font-weight:500}
  .muted{color:var(--muted)} h3{font-size:1rem;margin-bottom:6px}
  p{line-height:1.5}

  /* ---------- Sticky header: status bar + tabs always visible ---------- */
  #head{position:sticky;top:0;z-index:10;background:var(--bg);padding-top:16px;display:flex;flex-direction:column;gap:8px}
  .prof{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
  .age{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;line-height:.9;color:var(--violet)}
  .age small{font-size:.9rem;color:var(--muted);margin-left:4px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
  .stat-top{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:3px}
  .stat-top b{color:var(--text)}
  .bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
  .fill{height:100%;border-radius:3px;transition:width .4s}
  .wealth{display:flex;justify-content:space-between;margin-top:10px;font-size:.85rem;color:var(--muted)}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .tab{padding:9px 0;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:10px;font:500 .85rem 'DM Sans';cursor:pointer}
  .tab.on{color:var(--text);border-color:var(--violet)}
  .tab:disabled{opacity:.4;cursor:not-allowed}

  /* ---------- Buttons ---------- */
  .btn{display:block;width:100%;text-align:left;margin-top:8px;padding:12px 14px;background:transparent;color:var(--text);font:inherit;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:border-color .15s,background .15s}
  .btn:hover:not(:disabled),.btn:focus-visible{border-color:var(--violet);background:#1a1a2b;outline:none}
  .btn.sel{border-color:var(--violet);background:#1a1a2b}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn small{display:block;color:var(--muted);margin-top:2px}
  .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:.9rem}
  .row:last-child{border:0}
  #age-wrap{position:sticky;bottom:12px;z-index:10}
  #age-btn{width:100%;padding:16px;border:0;border-radius:12px;cursor:pointer;background:var(--violet);color:#fff;font:700 1rem 'DM Sans'}
  #age-btn:hover:not(:disabled){filter:brightness(1.12)} #age-btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
  #hint{font-size:.8rem;color:var(--amber);text-align:center;min-height:1.2em;margin-bottom:4px}
  #log{max-height:220px;overflow-y:auto;font-size:.88rem}
  .log-row{padding:6px 0;border-bottom:1px solid var(--line);color:var(--muted)}
  .log-row b{color:var(--cyan);margin-right:8px;font-family:'JetBrains Mono',monospace;font-weight:500}
  .overlay{text-align:center;padding:28px 16px;margin-top:16px}
  .overlay h1{font-family:'Bebas Neue',sans-serif;font-size:3rem;font-weight:400;color:var(--violet)}
  .overlay p{color:var(--muted);margin:8px 0 16px}
  .overlay input{width:100%;padding:12px;margin-bottom:12px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;font:inherit;text-align:center}
  .hidden{display:none!important}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <!-- START SCREEN -->
  <section id="start" class="card overlay">
    <h1>Lifeline</h1>
    <p>You are six years old. School, work and money are all ahead of you.</p>
    <input id="name-input" placeholder="Your name" maxlength="20" autocomplete="off">
    <button class="btn" id="start-btn" style="text-align:center" onclick="startGame()">Begin life</button>
  </section>

  <!-- GAME SCREEN: sticky header, swappable tab view, sticky Age Up button -->
  <div id="game" class="hidden" style="display:flex;flex-direction:column;gap:12px">
    <header id="head">
      <section class="card" id="top"></section>
      <nav class="tabs" id="tabs"></nav>
    </header>
    <main id="view" style="display:flex;flex-direction:column;gap:12px"></main>
    <div id="age-wrap"><div id="hint"></div><button id="age-btn" onclick="ageUp()">Age up</button></div>
  </div>

  <!-- GAME OVER -->
  <section id="gameover" class="card overlay hidden">
    <h1>You passed away</h1><p id="summary"></p>
    <button class="btn" style="text-align:center" onclick="location.reload()">Live another life</button>
  </section>
</div>

<script>
/* =====================================================================
   1. DATA TABLES – edit these to rebalance or add content
   ===================================================================== */
// School types: cost per year (billed to the player's wealth), Smarts multiplier, social modifier
const SCHOOLS = {
  public:  {name:'Public school',  cost:0,    mult:1,   social:0,  desc:'Free. Steady learning, plenty of classmates.'},
  private: {name:'Private school', cost:2500, mult:1.5, social:0,  desc:'$2,500/yr. Biggest Smarts gains.'},
  home:    {name:'Homeschool',     cost:300,  mult:1.2, social:-1, desc:'$300/yr. Flexible, but fewer friends.'}
};
// Yearly effort levels (Smarts gain is scaled by school multiplier)
const EFFORT = {
  hard:  {label:'Study hard', smarts:4,  happiness:-3, social:-1},
  coast: {label:'Coast by',   smarts:1,  happiness:0,  social:0},
  skip:  {label:'Skip class', smarts:-3, happiness:4,  social:2}
};
// Entry-level jobs: diploma and minimum Smarts are the requirements
const JOBS = [
  {id:'fast',   title:'Fast Food Crew',       salary:14000, diploma:false, smarts:0},
  {id:'retail', title:'Retail Associate',     salary:18000, diploma:true,  smarts:0},
  {id:'intern', title:'Junior Office Intern', salary:23000, diploma:true,  smarts:55},
  {id:'teller', title:'Bank Teller',          salary:30000, diploma:true,  smarts:65}
];
const LIVING_COST = 8000;   // yearly rent/food/bills once you turn 18 (parents cover it before)
// Activities: each uses one of your 2 yearly action slots
const ACTIVITIES = [
  {label:'Hit the gym',     cost:120, fx:{health:6, happiness:1},  msg:'You spent the year getting fitter.'},
  {label:'Read a book',     cost:0,   fx:{smarts:3},               msg:'You lost yourself in a good book.'},
  {label:'Meet up with friends', cost:40, fx:{social:6, happiness:3}, msg:'You made time for friends.'},
  {label:'Volunteer',       cost:0,   fx:{social:3, happiness:4},  msg:'Helping out felt great.'}
];

/* Random events. fx can be an object or a function (random outcomes); a function may add a `msg`. */
const EVENTS = [
  {id:'exam',min:6,max:18,title:'Big exam tomorrow',text:'A major exam is tomorrow and you are not ready.',choices:[
    {label:'Study all night',fx:{smarts:6,health:-3,happiness:-3},result:'You studied late and did well, but you were tired.'},
    {label:'Wing it',fx:{smarts:-1,happiness:2},result:'You slept well and scraped a pass.'},
    {label:'Copy a classmate',fx:()=>Math.random()<.5?{smarts:2,happiness:3,msg:'You got away with it.'}:{smarts:-3,happiness:-6,social:-3,msg:'You were caught cheating.'}}]},
  {id:'bully',min:7,max:17,title:'The bully',text:'An older kid keeps taking your lunch money.',choices:[
    {label:'Stand up to them',fx:{health:-6,happiness:4,social:2},result:'You took a bruise, but they backed off.'},
    {label:'Tell a teacher',fx:{happiness:2,social:1},result:'The teacher stepped in and it stopped.'},
    {label:'Keep quiet',fx:{happiness:-7,social:-2},result:'You stayed quiet and it kept happening.'}]},
  {id:'teacher',min:8,max:18,title:'Teacher interaction',text:'Your teacher notices you struggling and offers extra help after class.',choices:[
    {label:'Accept the help',fx:{smarts:5,social:2,happiness:-1},result:'The extra lessons paid off.'},
    {label:'Politely decline',fx:{happiness:1},result:'You kept your afternoons free.'},
    {label:'Argue about the grade',fx:{social:-2,happiness:-2},result:'The argument went nowhere.'}]},
  {id:'club',min:8,max:18,title:'Join a club?',text:'Sign-up week is here. The sports team and student council are recruiting.',choices:[
    {label:'Join the sports team',fx:{health:6,social:4,happiness:2},result:'You made the team and got fitter.'},
    {label:'Run for student council',fx:{smarts:3,social:4,happiness:-1},result:'You joined student council and learned how to lead.'},
    {label:'No clubs this year',fx:{happiness:1},result:'You kept things simple.'}]},
  {id:'gift',min:6,max:17,title:'Birthday money',text:'Relatives send you $100 for your birthday.',choices:[
    {label:'Save it',fx:{wealth:100,happiness:1},result:'You tucked the money away.'},
    {label:'Spend it on fun',fx:{happiness:5,social:1},result:'You treated yourself and your friends.'}]},
  {id:'party',min:15,max:30,title:'Late party',text:'Friends invite you to a party that will go very late.',choices:[
    {label:'Go',fx:{happiness:8,social:3,health:-5},result:'Great night, rough morning.'},
    {label:'Stay home',fx:{happiness:-2,social:-2,health:2},result:'You rested, but felt left out.'}]},
  {id:'medical',min:18,max:100,title:'Medical bill',text:'An unexpected illness leads to a $900 medical bill.',choices:[
    {label:'Pay for treatment',fx:{wealth:-900,health:3},result:'You paid $900 and recovered.'},
    {label:'Skip treatment',fx:{health:-10,happiness:-3},result:'You skipped treatment and it hit your health.'}]},
  {id:'car',min:18,max:80,title:'Car trouble',text:'Your car breaks down. The mechanic quotes $700.',choices:[
    {label:'Pay for the repair',fx:{wealth:-700},result:'You paid $700 and got back on the road.'},
    {label:'Use the bus instead',fx:{happiness:-4,social:-1},result:'Commuting by bus was a daily hassle.'}]},
  {id:'checkup',min:35,max:100,title:'Doctor visit',text:'Your doctor recommends lifestyle changes.',choices:[
    {label:'Follow the advice',fx:{health:8,happiness:-2},result:'You changed your habits and feel better.'},
    {label:'Ignore it',fx:{health:-8,happiness:2},result:'You ignored it. Your body noticed.'}]}
];

/* =====================================================================
   2. STATE
   ===================================================================== */
let S, activeTab = 'life';

function newGame(name){
  S = {name:name||'Alex', age:6, health:100, happiness:100, smarts:50, social:50, wealth:0,
       school:null, effort:'coast', skips:0, diploma:false,    // education
       job:null,                                               // {title,salary,perf,years,level}
       income:0, expenses:0,                                   // last year's finances
       actions:2, worked:false, promoTried:false,              // per-year limits
       pending:false, lastEvent:null, ev:null, logRows:[]};    // event + log
}

/* =====================================================================
   3. HELPERS
   ===================================================================== */
const $ = id => document.getElementById(id);
const clamp = n => Math.max(0, Math.min(100, Math.round(n)));
const money = n => (n<0?'-$':'$') + Math.abs(Math.round(n)).toLocaleString();
const hint = t => { $('hint').textContent = t||''; };
function log(t){ S.logRows.unshift({age:S.age, t}); }

/* Applies a stat-change object; wealth is uncapped, other stats clamp to 0-100 */
function fx(o){
  for (const k of ['health','happiness','smarts','social']) if (o[k]) S[k] = clamp(S[k]+o[k]);
  if (o.wealth) S.wealth += o.wealth;
}
const bar = (l,v,c) => `<div><div class="stat-top"><span>${l}</span><b class="mono">${v}%</b></div><div class="bar"><div class="fill" style="width:${v}%;background:${c}"></div></div></div>`;
function go(t){ activeTab=t; render(); }

/* =====================================================================
   4. RENDERING – header is always shown; only #view changes per tab
   ===================================================================== */
function render(){
  $('top').innerHTML = `
    <div class="prof"><b>${S.name}</b><div class="age">${S.age}<small>years old</small></div></div>
    <div class="stats">${bar('Health',S.health,'var(--rose)')}${bar('Happiness',S.happiness,'var(--amber)')}${bar('Smarts',S.smarts,'var(--cyan)')}${bar('Relationships',S.social,'var(--violet)')}</div>
    <div class="wealth"><span>Wealth</span><b class="mono" style="color:${S.wealth<0?'var(--rose)':'var(--mint)'}">${money(S.wealth)}</b></div>`;
  const locked = S.age < 18;
  $('tabs').innerHTML = [['life','Life'],['school','School'],['career','Career'],['act','Activities']].map(([id,l]) =>
    `<button class="tab ${activeTab===id?'on':''}" ${id==='career'&&locked?'disabled title="Unlocks at 18"':''} onclick="go('${id}')">${l}</button>`).join('');
  $('age-btn').disabled = S.pending;
  $('view').innerHTML = ({life:viewLife, school:viewSchool, career:viewCareer, act:viewActivities})[activeTab]();
}

/* LIFE TAB: current event + history log */
function viewLife(){
  const e = S.ev;
  const eventCard = e
    ? `<section class="card"><h3>${e.title}</h3><p class="muted">${e.text}</p>${(e.choices||[]).map((c,i)=>`<button class="btn" onclick="choose(${i})">${c.label}</button>`).join('')}</section>`
    : `<section class="card"><h3>Your story</h3><p class="muted">Press Age up to continue.</p></section>`;
  return eventCard + `<section class="card"><h3>Life log</h3><div id="log">${S.logRows.map(r=>`<div class="log-row"><b>Age ${r.age}</b>${r.t}</div>`).join('')}</div></section>`;
}

/* SCHOOL TAB: pick school type + yearly effort */
function viewSchool(){
  if (S.age > 18) return `<section class="card"><h3>Graduated</h3><p class="muted">You left school at 18. High school diploma: <b>${S.diploma?'yes':'no (too many skipped years)'}</b>.</p></section>`;
  const schools = Object.entries(SCHOOLS).map(([k,s]) => `<button class="btn ${S.school===k?'sel':''}" onclick="pickSchool('${k}')">${s.name}<small>${s.desc}</small></button>`).join('');
  const efforts = Object.entries(EFFORT).map(([k,e]) => `<button class="btn ${S.effort===k?'sel':''}" onclick="pickEffort('${k}')">${e.label}</button>`).join('');
  return `<section class="card"><h3>Education</h3><p class="muted">Choose where you study. You can switch at any time.</p>${schools}</section>
    <section class="card"><h3>Effort this year</h3><p class="muted">Applied when you age up. Studying raises Smarts, skipping lifts mood and friendships. Years skipped: ${S.skips}.</p>${efforts}</section>`;
}

/* CAREER TAB: finances, current job, job market */
function viewCareer(){
  const net = S.income - S.expenses;
  const fin = `<section class="card"><h3>Finances (last year)</h3>
    <div class="row"><span>Annual income</span><b class="mono" style="color:var(--mint)">${money(S.income)}</b></div>
    <div class="row"><span>Expenses</span><b class="mono" style="color:var(--rose)">${money(-S.expenses)}</b></div>
    <div class="row"><span>Net change</span><b class="mono">${money(net)}</b></div>
    <div class="row"><span>Net worth</span><b class="mono">${money(S.wealth)}</b></div>
    <p class="muted" style="margin-top:6px;font-size:.8rem">Living costs: ${money(LIVING_COST)}/yr once you turn 18.</p></section>`;
  if (S.job){
    const j = S.job;
    return fin + `<section class="card"><h3>${j.title}</h3><p class="muted">Salary ${money(j.salary)}/yr · ${j.years} year(s) here</p>
      <div style="margin:10px 0">${bar('Performance',j.perf,'var(--cyan)')}</div>
      <button class="btn" ${S.worked?'disabled':''} onclick="workHarder()">Work harder<small>Performance up, a little tired. Once a year.</small></button>
      <button class="btn" ${S.promoTried?'disabled':''} onclick="askPromotion()">Ask for a promotion<small>Odds depend on performance, Smarts and tenure. Once a year.</small></button>
      <button class="btn" onclick="quitJob()">Quit / resign</button></section>`;
  }
  const list = JOBS.map(j => {
    const why = (j.diploma&&!S.diploma?'Needs a diploma. ':'') + (S.smarts<j.smarts?`Needs ${j.smarts}% Smarts.`:'');
    return `<button class="btn" ${why?'disabled':''} onclick="applyJob('${j.id}')">${j.title} · ${money(j.salary)}/yr<small>${why||'You qualify.'}</small></button>`;
  }).join('');
  return fin + `<section class="card"><h3>Job market</h3><p class="muted">You are unemployed. Apply to an entry-level job.</p>${list}</section>`;
}

/* ACTIVITIES TAB: 2 actions per year */
function viewActivities(){
  const list = ACTIVITIES.map((a,i) => `<button class="btn" ${S.actions<1?'disabled':''} onclick="doActivity(${i})">${a.label}<small>${a.cost&&S.age>=18?money(a.cost):'Free'}</small></button>`).join('');
  return `<section class="card"><h3>Activities</h3><p class="muted">Actions left this year: <b>${S.actions}</b></p>${list}</section>`;
}

/* =====================================================================
   5. PLAYER ACTIONS
   ===================================================================== */
function pickSchool(k){ S.school=k; if(!S.logRows.some(r=>r.t.startsWith('Enrolled'))) log(`Enrolled in ${SCHOOLS[k].name}.`); hint(); render(); }
function pickEffort(k){ S.effort=k; render(); }

function applyJob(id){
  const j = JOBS.find(x=>x.id===id);
  S.job = {title:j.title, salary:j.salary, perf:50, years:0, level:1};
  log(`Hired as ${j.title} (${money(j.salary)}/yr).`); render();
}
function workHarder(){
  S.worked=true; S.job.perf=clamp(S.job.perf+12); fx({health:-3,happiness:-3});
  log('You put in extra hours at work.'); render();
}
function askPromotion(){
  S.promoTried=true; const j=S.job;
  const p = (j.perf*.6 + S.smarts*.3 + Math.min(j.years,5)*3)/100;   // success probability
  if (Math.random()<p){
    j.salary=Math.round(j.salary*1.2); j.level++; fx({happiness:6});
    log(`Promoted! ${j.title} level ${j.level}, now ${money(j.salary)}/yr.`);
  } else { j.perf=clamp(j.perf-5); fx({happiness:-4}); log('Your promotion request was turned down.'); }
  render();
}
function quitJob(){ log(`You quit your job as ${S.job.title}.`); S.job=null; render(); }
function doActivity(i){
  const a=ACTIVITIES[i], cost = S.age>=18?a.cost:0;
  S.actions--; S.wealth-=cost; fx(a.fx); log(a.msg); render();
}

/* =====================================================================
   6. EVENTS
   ===================================================================== */
function choose(i){
  const c = S.ev.choices[i];
  const f = typeof c.fx==='function' ? c.fx() : c.fx;
  fx(f);
  const msg = f.msg || c.result;
  log(`${S.ev.title}: ${msg}`);
  S.ev = {title:S.ev.title, text:msg, choices:[]};   // show the outcome, no more buttons
  S.pending = false;
  checkDeath(); render();
}

/* =====================================================================
   7. THE YEARLY TICK
   ===================================================================== */
function ageUp(){
  if (S.pending) return hint('Make your choice first.');
  if (S.age < 18 && !S.school){ go('school'); return hint('Pick a school type first.'); }
  hint();
  S.age++; S.actions=2; S.worked=false; S.promoTried=false; S.income=0; S.expenses=0;
  const notes = [];

  // --- School year just completed (ages 7-18) ---
  if (S.age <= 18){
    const sc=SCHOOLS[S.school], ef=EFFORT[S.effort];
    S.expenses += sc.cost;
    fx({smarts:Math.round(ef.smarts>0?ef.smarts*sc.mult:ef.smarts), happiness:ef.happiness, social:ef.social+sc.social});
    if (S.effort==='skip') S.skips++;
    notes.push(`${ef.label.toLowerCase()} at ${sc.name.toLowerCase()}`);
  }
  if (S.age===18){ S.diploma = S.skips<5; log(S.diploma?'You graduated with a high school diploma. The Career tab is unlocked.':'You left school without a diploma. The Career tab is unlocked.'); }

  // --- Money (adults pay living costs, employed adults earn salary) ---
  if (S.age>=18){
    S.expenses += LIVING_COST;
    if (S.job){
      S.income = S.job.salary; S.job.years++; S.job.perf = clamp(S.job.perf-2);
      if (S.job.perf<10){ log(`You were fired from ${S.job.title} for poor performance.`); S.job=null; S.income=0; }
    }
  }
  S.wealth += S.income - S.expenses;
  if (S.age>=18) notes.push(`earned ${money(S.income)}, spent ${money(S.expenses)}`);
  if (S.wealth<0 && S.age>=18){ fx({happiness:-3}); notes.push('debt is weighing on you'); }

  // --- Natural decline after 50 ---
  if (S.age>50) fx({health:-Math.ceil((S.age-50)/8)});
  if (notes.length) log(notes.join('; ')+'.');

  // --- Random event ---
  const pool = EVENTS.filter(e=>S.age>=e.min && S.age<=e.max && e.id!==S.lastEvent);
  if (pool.length && Math.random()<.8){
    const e = pool[Math.floor(Math.random()*pool.length)];
    S.lastEvent=e.id; S.ev=e; S.pending=true; activeTab='life';
  } else S.ev={title:'A quiet year',text:'Nothing major happened. Life went on.',choices:[]};

  checkDeath(); render();
}

function checkDeath(){
  if (S.health>0) return;
  $('game').classList.add('hidden'); $('gameover').classList.remove('hidden');
  $('summary').textContent = `${S.name} lived to ${S.age}. Final wealth: ${money(S.wealth)}. Smarts ${S.smarts}%, Happiness ${S.happiness}%, Relationships ${S.social}%.`;
}

/* =====================================================================
   8. START
   ===================================================================== */
function startGame(){
  newGame($('name-input').value.trim());
  $('start').classList.add('hidden'); $('game').classList.remove('hidden');
  log('Life began at age 6. Pick a school in the School tab.');
  S.ev={title:'Your story begins',text:`${S.name}, you are 6 and about to start school. Open the School tab and choose where to study.`,choices:[]};
  render();
}
$('name-input').addEventListener('keydown', e => { if (e.key==='Enter') startGame(); });
</script>
</body>
</html>
