<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lifeline – Realistic Life Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- START SCREEN -->
  <section id="start" class="card overlay">
    <h1>Lifeline</h1>
    <p>It is 2007. You are six years old. Every choice shapes the story ahead.</p>
    <div class="bigav" id="av-big"></div>
    <div class="picker" id="av-g"></div>
    <div class="picker" id="av-t"></div>
    <select id="country-sel" style="width:100%;margin-bottom:10px"></select>
    <div class="picker" id="like-p" style="gap:6px"></div>
    <p class="muted" id="country-desc" style="font-size:.82rem;margin:0 0 12px"></p>
    <input id="name-input" placeholder="Your name" maxlength="20" autocomplete="off">
    <button class="btn" id="start-btn" style="text-align:center" onclick="startGame()">Begin life</button>
    <button class="btn hidden" id="cont-btn" style="text-align:center" onclick="loadGame()">Continue saved life</button>
  </section>

  <!-- GAME SCREEN -->
  <div id="game" class="hidden" style="display:flex;flex-direction:column;gap:12px">
    <header id="head">
      <section class="card" id="top"></section>
      <nav class="tabs" id="tabs"></nav>
    </header>
    <main id="view" style="display:flex;flex-direction:column;gap:12px"></main>
    <div id="age-wrap"><div id="hint"></div><button id="age-btn" onclick="ageUp()">Age up</button></div>
  </div>
  <!-- Interactive phone, inspired by the supplied alternate version -->
  <div id="life-phone-modal" class="p16-phone-backdrop hidden" role="dialog" aria-modal="true" aria-label="Your phone">
    <div class="p16-phone-shell">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <div><div class="muted" style="font-size:.72rem">LIFELINE DEVICE</div><h3 id="p16-phone-model" style="margin-top:3px">Your phone</h3></div>
        <button class="menu-btn" onclick="closeLifePhone()">Close</button>
      </div>
      <div id="p16-phone-screen" class="p16-phone-screen"></div>
    </div>
  </div>
</div>

<script src="js/01-data.js"></script>
<script src="js/02-state.js"></script>
<script src="js/03-views.js"></script>
<script src="js/04-actions.js"></script>
<script src="js/05-ageup.js"></script>
<script src="js/06-setup.js"></script>
<script src="js/07-era-prices.js"></script>
<script src="js/08-countries-money.js"></script>
<script src="js/09-phase11-careers-education.js"></script>
<script src="js/10-phase12-leave-property.js"></script>
<script src="js/11-phase14-realism.js"></script>
<script src="js/12-phase15-16-jobs.js"></script>
<script src="js/13-phase17-family-travel.js"></script>
<script src="js/14-phase18-careers-travel.js"></script>
<script src="js/15-phase19-20-life.js"></script>
<script src="js/16-phase21-fixes.js"></script>
</body>
</html>
