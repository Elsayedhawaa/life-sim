<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lifeline – Realistic Life Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- START SCREEN -->
  <section id="start" class="card overlay">
    <h1>Lifeline</h1>
    <p>It is 2007. You are six years old. Every choice shapes the story ahead.</p>
    <div class="bigav" id="av-big"></div>
    <div class="picker" id="av-g"></div>
    <div class="picker" id="av-t"></div>
    <select id="country-sel" style="width:100%;margin-bottom:10px"></select>
    <div class="picker" id="like-p" style="gap:6px"></div>
    <p class="muted" id="country-desc" style="font-size:.82rem;margin:0 0 12px"></p>
    <input id="name-input" placeholder="Your name" maxlength="20" autocomplete="off">
    <button class="btn" id="start-btn" style="text-align:center" onclick="startGame()">Begin life</button>
    <button class="btn hidden" id="cont-btn" style="text-align:center" onclick="loadGame()">Continue saved life</button>
  </section>

  <!-- GAME SCREEN -->
  <div id="game" class="hidden" style="display:flex;flex-direction:column;gap:12px">
    <header id="head">
      <section class="card" id="top"></section>
      <nav class="tabs" id="tabs"></nav>
    </header>
    <main id="view" style="display:flex;flex-direction:column;gap:12px"></main>
    <div id="age-wrap"><div id="hint"></div><button id="age-btn" onclick="ageUp()">Age up</button></div>
  </div>
  <!-- Interactive phone, inspired by the supplied alternate version -->
  <div id="life-phone-modal" class="p16-phone-backdrop hidden" role="dialog" aria-modal="true" aria-label="Your phone">
    <div class="p16-phone-shell">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <div><div class="muted" style="font-size:.72rem">LIFELINE DEVICE</div><h3 id="p16-phone-model" style="margin-top:3px">Your phone</h3></div>
        <button class="menu-btn" onclick="closeLifePhone()">Close</button>
      </div>
      <div id="p16-phone-screen" class="p16-phone-screen"></div>
    </div>
  </div>
</div>

<div id="load-error" style="display:none;position:fixed;left:0;right:0;top:0;z-index:99999;background:#7f1d1d;color:#fff;padding:10px 14px;font:14px/1.4 system-ui;white-space:pre-wrap"></div>
<script>
function loadFail(m){var b=document.getElementById('load-error');b.style.display='block';b.textContent+=m+'\n';}
window.addEventListener('error',function(e){if(e.target&&e.target.tagName==='SCRIPT')return;loadFail('Script error: '+e.message+' ('+(e.filename||'').split('/').pop()+':'+e.lineno+')');});
</script>
<script src="01-data.js" onerror="loadFail('MISSING FILE: 01-data.js')"></script>
<script src="02-state.js" onerror="loadFail('MISSING FILE: 02-state.js')"></script>
<script src="03-views.js" onerror="loadFail('MISSING FILE: 03-views.js')"></script>
<script src="04-actions.js" onerror="loadFail('MISSING FILE: 04-actions.js')"></script>
<script src="05-ageup.js" onerror="loadFail('MISSING FILE: 05-ageup.js')"></script>
<script src="06-setup.js" onerror="loadFail('MISSING FILE: 06-setup.js')"></script>
<script src="07-era-prices.js" onerror="loadFail('MISSING FILE: 07-era-prices.js')"></script>
<script src="08-countries-money.js" onerror="loadFail('MISSING FILE: 08-countries-money.js')"></script>
<script src="09-phase11-careers-education.js" onerror="loadFail('MISSING FILE: 09-phase11-careers-education.js')"></script>
<script src="10-phase12-leave-property.js" onerror="loadFail('MISSING FILE: 10-phase12-leave-property.js')"></script>
<script src="11-phase14-realism.js" onerror="loadFail('MISSING FILE: 11-phase14-realism.js')"></script>
<script src="12-phase15-16-jobs.js" onerror="loadFail('MISSING FILE: 12-phase15-16-jobs.js')"></script>
<script src="13-phase17-family-travel.js" onerror="loadFail('MISSING FILE: 13-phase17-family-travel.js')"></script>
<script src="14-phase18-careers-travel.js" onerror="loadFail('MISSING FILE: 14-phase18-careers-travel.js')"></script>
<script src="15-phase19-20-life.js" onerror="loadFail('MISSING FILE: 15-phase19-20-life.js')"></script>
<script src="16-phase21-fixes.js" onerror="loadFail('MISSING FILE: 16-phase21-fixes.js')"></script>
</body>
</html>
